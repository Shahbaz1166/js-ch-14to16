<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var studentScores = [320, 230, 480, 120];
      document.write(
        "<h3>" + "Scores of Students: " + studentScores + "<br>" + "</h3>",
      );

      studentScores.sort();

      document.write(
        "<h3>" +
          "Ordered Scores of Students: " +
          studentScores +
          "<br>" +
          "</h3>",
      );
    </script>
  </body>
</html>
