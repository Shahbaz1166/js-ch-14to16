<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var qualifications = [
        "SSC",
        "HSC",
        "BCS",
        "BS",
        "BCOM",
        "MS",
        "M. Phil.",
        "PhD",
      ];

      document.write("<h3>Qualifications:</h3>");
      for (var i = 0; i < qualifications.length; i++) {
        document.write(i + 1 + ") " + qualifications[i] + "<br>");
      }
    </script>
  </body>
</html>
